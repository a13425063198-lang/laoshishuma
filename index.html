<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大湿数码推荐</title>
<style>
:root {
--primary: #3b82ff;
--dark-bg: #0f172a;
--card-bg: #1e2942;
--input-bg: #273450;
--reset-btn: #2a3755;
--clear-btn: #312340;
--text-white: #ffffff;
--text-gray: #b8c8f0;
--radius: 16px;
--btn-radius: 12px;
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}
body {
min-height: 100vh;
padding: 16px;
color: var(--text-white);
background: var(--dark-bg);
}
body::before {
content: '';
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
z-index: -2;
background: linear-gradient(45deg,#0a1028,#142250,#0f1838,#1e2b60,#0a1028);
background-size: 1200% 1200%;
animation: bgFlow 8s ease infinite alternate;
}
@keyframes bgFlow {
0%{background-position:0% 0%}
100%{background-position:100% 100%}
}
.container {
max-width: 600px;
margin: 0 auto;
background: rgba(15, 23, 42, 0.85);
backdrop-filter: blur(16px);
border-radius: var(--radius);
padding: 30px 24px;
box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.header {
text-align: center;
margin-bottom: 30px;
padding-bottom: 20px;
border-bottom: 1px solid rgba(255,255,255,0.1);
}
h1 {
font-size: 26px;
margin-bottom: 10px;
color: var(--text-white);
}
.subtitle {
font-size: 15px;
color: var(--text-gray);
}
.tip-bar {
width: 100%;
padding: 14px;
background: var(--input-bg);
border-radius: var(--btn-radius);
margin-bottom: 16px;
border-left: 4px solid var(--primary);
color: var(--text-white);
}
.filter {
display: flex;
flex-direction: column;
gap: 16px;
}
input, select {
width: 100%;
padding: 14px 16px;
background: var(--input-bg);
border: none;
border-radius: var(--btn-radius);
color: var(--text-white);
font-size: 15px;
appearance: none;
}
input::placeholder, select {
color: var(--text-gray);
}
.price-row {
display: flex;
gap: 12px;
align-items: center;
}
.price-input {
flex: 1;
}
.price-sep {
color: var(--text-gray);
}
.btn-row {
display: flex;
gap: 12px;
margin-top: 8px;
}
.search-btn {
flex: 1;
padding: 14px;
border: none;
border-radius: var(--btn-radius);
background: var(--primary);
color: white;
font-size: 15px;
font-weight: 600;
}
.reset-btn {
flex: 1;
padding: 14px;
border: none;
border-radius: var(--btn-radius);
background: var(--reset-btn);
color: white;
font-size: 15px;
}
.clear-btn {
flex: 1;
padding: 14px;
border: none;
border-radius: var(--btn-radius);
background: var(--clear-btn);
color: #ffb0b0;
font-size: 15px;
}
.sort-row {
display: flex;
gap: 10px;
justify-content: center;
margin-top: 12px;
}
.sort-btn {
padding: 10px 22px;
border: none;
border-radius: var(--btn-radius);
background: var(--input-bg);
color: white;
font-size: 14px;
}
.sort-btn.active {
background: var(--primary);
}
.result-count {
margin: 20px 0 12px;
color: var(--text-gray);
font-size: 13px;
}
.phone-list {
display: flex;
flex-direction: column;
gap: 12px;
}
.phone-item {
background: var(--card-bg);
border-radius: var(--btn-radius);
padding: 16px;
}
.brand-tag {
display: inline-block;
padding: 3px 8px;
background: rgba(59,130,255,0.15);
color: var(--primary);
border-radius: 4px;
font-size: 11px;
margin-bottom: 6px;
}
.phone-name {
font-size: 16px;
font-weight: 600;
margin-bottom: 4px;
}
.phone-price {
color: #ff7a7a;
font-size: 18px;
font-weight: 600;
margin-bottom: 6px;
}
.phone-spec {
font-size: 13px;
color: var(--text-gray);
line-height: 1.5;
}
.modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.7);
display: none;
justify-content: center;
align-items: center;
padding: 20px;
z-index: 999;
}
.modal-content {
width: 100%;
max-width: 480px;
background: var(--card-bg);
border-radius: var(--radius);
padding: 24px;
}
.modal-price {
color: #ff7a7a;
font-size: 22px;
margin: 12px 0;
font-weight: 600;
}
.modal-spec {
background: var(--input-bg);
padding: 12px;
border-radius: 8px;
margin: 10px 0;
}
.history-box {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-top: 4px;
}
.history-item {
background: var(--input-bg);
padding: 4px 8px;
border-radius: 6px;
font-size: 12px;
cursor: pointer;
}
.no-result {
text-align: center;
padding: 30px;
color: var(--text-gray);
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>📱 大湿数码推荐</h1>
<p class="subtitle">二手手机智能筛选平台</p>
</div>
<div class="tip-bar" id="tipBar">加载中...</div>
<div class="filter">
<input type="text" id="keyword" placeholder="搜索手机型号或配置...">
<div class="history-box" id="historyBox"></div>
<select id="brand">
<option value="全部">所有品牌</option>
<option value="小米">小米</option>
<option value="红米">红米</option>
<option value="一加">一加</option>
<option value="OPPO">OPPO</option>
<option value="vivo">vivo</option>
<option value="苹果">苹果</option>
<option value="魅族">魅族</option>
<option value="华为">华为</option>
</select>
<div class="price-row">
<input type="number" class="price-input" id="minPrice" placeholder="最低价">
<span class="price-sep">-</span>
<input type="number" class="price-input" id="maxPrice" placeholder="最高价">
</div>
<div class="btn-row">
<button class="search-btn" onclick="filterPhone()">🔍 搜索</button>
<button class="reset-btn" onclick="resetFilters()">🔄 重置</button>
<button class="clear-btn" onclick="clearAllFilters()">🗑 清空</button>
</div>
<div class="sort-row">
<button class="sort-btn active" onclick="sortPhones('default')">默认</button>
<button class="sort-btn" onclick="sortPhones('asc')">价格升序</button>
<button class="sort-btn" onclick="sortPhones('desc')">价格降序</button>
</div>
</div>
<div class="result-count" id="resultCount"></div>
<div id="result"></div>
</div>
<div class="modal" id="modal">
<div class="modal-content">
<h2 id="modalTitle"></h2>
<div class="brand-tag" id="modalBrand"></div>
<div class="modal-price" id="modalPrice"></div>
<div class="modal-spec" id="modalSpec"></div>
</div>
</div>
<script src="data.json"></script>
<script>
const modal = document.getElementById('modal');
let currentList = [];
let currentSort = 'default';
let phones = JSON.parse(phoneData);

function getRandomPhones(count) {
return [...phones].sort(() => 0.5 - Math.random()).slice(0, count);
}
function escapeHtml(unsafe) {
if (!unsafe) return '';
return unsafe.replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">").replace(/"/g,""").replace(/'/g,"'");
}
function getHistory() {
return JSON.parse(localStorage.getItem('searchHistory') || '[]');
}
function saveHistory(word) {
if (!word) return;
let h = getHistory();
h = [word, ...h.filter(x=>x!==word)];
if(h.length>5)h=h.slice(0,5);
localStorage.setItem('searchHistory',JSON.stringify(h));
renderHistory();
}
function renderHistory() {
document.getElementById('historyBox').innerHTML = getHistory().map(w=>`<div class="history-item" onclick="useHistory('${escapeHtml(w)}')">${escapeHtml(w)}</div>`).join('');
}
function useHistory(w) {
document.getElementById('keyword').value = w;
filterPhone();
}
const tips = ["💡 二手手机优先看电池健康，85%以上更耐用","💡 骁龙870/天玑8100 百元档神U，发热低","💡 2K屏更清晰，但更耗电，1.5K是均衡选择","💡 百瓦快充虽然快，但长期会略微加速电池老化","💡 LCD屏护眼，OLED色彩好，看需求选择","💡 买二手尽量走平台，避免骗子","💡 骁龙8+、骁龙8 Gen2 性价比极高"];
document.getElementById('tipBar').innerText = tips[Math.floor(Math.random()*tips.length)];
document.addEventListener('DOMContentLoaded',()=>{
currentList = getRandomPhones(5);
updateResultCount();
renderPhoneList();
renderHistory();
document.getElementById('keyword').addEventListener('keypress',e=>e.key==='Enter'&&filterPhone());
});
function clearAllFilters() {
document.getElementById('keyword').value='';
document.getElementById('brand').value='全部';
document.getElementById('minPrice').value='';
document.getElementById('maxPrice').value='';
}
function resetFilters() {
clearAllFilters();
currentList = getRandomPhones(5);
currentSort='default';
updateSortBtn();
updateResultCount();
renderPhoneList();
}
function filterPhone() {
const kw = document.getElementById('keyword').value.trim().toLowerCase();
const brand = document.getElementById('brand').value;
const min = parseInt(document.getElementById('minPrice').value)||0;
const max = parseInt(document.getElementById('maxPrice').value)||99999;
if(kw)saveHistory(kw);
currentList = phones.filter(p=>{
const txt = (p.brand+p.name+p.spec).toLowerCase();
return (!kw||txt.includes(kw))&&(brand==='全部'||p.brand===brand)&&p.price>=min&&p.price<=max;
});
applySort();
updateResultCount();
renderPhoneList();
}
function applySort() {
if(currentSort==='asc')currentList.sort((a,b)=>a.price-b.price);
if(currentSort==='desc')currentList.sort((a,b)=>b.price-a.price);
}
function sortPhones(t) {
currentSort = t;
applySort();
updateSortBtn();
renderPhoneList();
}
function updateSortBtn() {
document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
event.target.classList.add('active');
}
function updateResultCount() {
document.getElementById('resultCount').textContent = `共 ${currentList.length} 款机型`;
}
function renderPhoneList() {
const r = document.getElementById('result');
if(currentList.length===0){
r.innerHTML='<div class="no-result">暂无匹配机型</div>';return;
}
r.innerHTML = `<div class="phone-list">${currentList.map((p,i)=>`<div class="phone-item" onclick="showDetail(${i})"><div class="brand-tag">${p.brand}</div><div class="phone-name">${escapeHtml(p.name)}</div><div class="phone-price">${p.price}元</div><div class="phone-spec">${escapeHtml(p.spec)}</div></div>`).join('')}</div>`;
}
function showDetail(i) {
const p = currentList[i];
document.getElementById('modalTitle').innerText = p.name;
document.getElementById('modalBrand').innerText = p.brand;
document.getElementById('modalPrice').innerText = p.price+'元';
document.getElementById('modalSpec').innerText = p.spec;
modal.style.display='flex';
}
window.onclick = e=>e.target===modal&&(modal.style.display='none');
</script>
</body>
</html>
